<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>名古屋 8 天 7 夜</title>
<style>
html,body{margin:0;height:100%}
body{background:#f5f2eb;color:#211f1b;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#lock{min-height:100%;display:grid;place-items:center}
.box{width:min(360px,calc(100vw - 48px));display:grid;gap:18px;padding:48px 0}
.k{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;color:#a8452a}
h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:900;font-size:40px;line-height:1.1}
p{margin:0;font-size:15px;line-height:1.7;color:#4a453d}
form{display:grid;gap:10px}
input{font:inherit;font-size:16px;padding:14px;border:1.5px solid #211f1b;background:#fff;color:#211f1b;border-radius:0}
button{font:inherit;font-size:16px;font-weight:700;padding:14px;border:none;background:#211f1b;color:#f5f2eb;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:22px;font-size:14px;color:#a8452a}
#view{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#f5f2eb}
</style></head><body>
<div id="lock"><div class="box">
<div class="k">PRIVATE · 2026.12</div>
<h1>名古屋<br>8 天 7 夜</h1>
<p>此行程僅限受邀者瀏覽，請輸入密碼。</p>
<form id="f"><input id="pw" type="password" placeholder="密碼" autocomplete="current-password" autofocus><button id="b" type="submit">開啟行程</button><div class="err" id="e"></div></form>
</div></div>
<iframe id="view" title="名古屋 8 天 7 夜"></iframe>
<script>
var ITER=300000,KEY='ngo-pass';
var dataP=null;
function getData(){if(!dataP)dataP=fetch('data.txt',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('load');return r.text()}).then(function(t){return fetch('data:application/octet-stream;base64,'+t.trim())}).then(function(r){return r.arrayBuffer()}).catch(function(x){dataP=null;throw new Error('load')});return dataP}
async function unlock(pw){
  var buf=new Uint8Array(await getData());
  var salt=buf.subarray(0,16),iv=buf.subarray(16,28),ct=buf.subarray(28);
  var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  var gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct);
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
}
async function go(pw,silent){
  var b=document.getElementById('b'),er=document.getElementById('e');
  b.disabled=true;b.textContent='解鎖中…';er.textContent='';
  var pt;
  try{pt=await unlock(pw)}catch(x){
    b.disabled=false;b.textContent='開啟行程';
    if(!silent)er.textContent=(x&&x.message==='load')?'檔案載入失敗，請確認 data.txt 已一起上傳。':'密碼錯誤，請再試一次。';
    try{sessionStorage.removeItem(KEY)}catch(y){}
    return;
  }
  try{sessionStorage.setItem(KEY,pw)}catch(y){}
  var url=URL.createObjectURL(new Blob([pt],{type:'text/html;charset=utf-8'}));
  var v=document.getElementById('view');
  v.onload=function(){document.getElementById('lock').style.display='none';v.style.display='block'};
  v.src=url;
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var v=document.getElementById('pw').value;if(v)go(v)});
getData().catch(function(){});
try{var s=sessionStorage.getItem(KEY);if(s)go(s,true)}catch(x){}
</script></body></html>
